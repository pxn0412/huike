<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>慧科 · 让每一次参赛有据可循</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/polish.css"><link rel="stylesheet" href="/final.css"></head>
<body>
<aside class="sidebar">
  <a class="brand" href="#home"><span class="brand-icon">慧</span><span>慧科<small>你的竞赛资料助手</small></span></a>
  <div class="nav-label">工作空间</div>
  <nav><button data-action="home" class="nav active">⌂ <span>首页</span></button><button data-action="library" class="nav">▦ <span>比赛库</span></button><button data-action="upload" class="nav">＋ <span>添加比赛资料</span></button><button data-action="profile" class="nav">◍ <span>我的画像</span></button><button data-action="recruit" class="nav">♧ <span>队伍招募</span></button></nav>
  <button class="identity" data-action="logout" title="退出登录"><span class="avatar">我</span><span id="identity-label">未登录</span><span>退出</span></button>
</aside>
<div class="workspace"><header><span id="breadcrumb">工作空间 / 首页</span></header><main id="main"></main></div>
<aside id="source-panel" class="source-panel" hidden><div class="source-head"><div><small>原始资料</small><h3 id="source-title"></h3></div><button data-action="close-source" aria-label="关闭原文">×</button></div><a id="source-link" target="_blank" rel="noopener">打开 / 下载原文件 ↗</a><iframe id="source-frame" title="原文件预览"></iframe></aside>
<section id="login-page" hidden><div class="login-card">
  <div class="login-brand"><span class="brand-icon">慧</span><span>慧科<small>你的竞赛资料助手</small></span></div>
  <div class="auth-tabs"><button type="button" class="auth-tab active" id="tab-login" data-action="auth-login">登录</button><button type="button" class="auth-tab" id="tab-register" data-action="auth-register">注册</button></div>
  <form id="login-form">
    <label>邮箱或手机号<input name="account" required maxlength="80" autocomplete="username" placeholder="you@example.com 或 13800000000"></label>
    <label>密码<input name="password" type="password" required maxlength="80" autocomplete="current-password" placeholder="你的密码"></label>
    <p class="error" id="login-error" hidden></p>
    <div class="actions"><button class="primary">登录</button></div>
    <p class="help-line">还没有账号？<button type="button" class="text-btn" data-action="auth-register">去注册 →</button></p>
  </form>
  <form id="register-form" hidden>
    <label>邮箱或手机号<input name="account" required maxlength="80" autocomplete="username" placeholder="you@example.com 或 13800000000"></label>
    <label>显示名称<input name="name" required maxlength="40" placeholder="会显示在资料上传者和招募发布者上"></label>
    <label>密码<input name="password" type="password" required minlength="6" maxlength="80" autocomplete="new-password" placeholder="至少 6 位"></label>
    <label>确认密码<input name="confirm" type="password" required minlength="6" maxlength="80" autocomplete="new-password" placeholder="再输一次"></label>
    <p class="error" id="register-error" hidden></p>
    <div class="actions"><button class="primary">注册并进入</button></div>
    <p class="help-line">已经有账号？<button type="button" class="text-btn" data-action="auth-login">去登录 →</button></p>
  </form>
  <p class="help-line">账号记着你的竞赛画像、招募和上传的资料；换台电脑登录也能看到自己的东西。</p>
</div></section>
<div id="toast" role="status" hidden></div><script src="/document-updates.js"></script><script src="/app.js"></script><script src="/demo.js"></script>
</body></html>
